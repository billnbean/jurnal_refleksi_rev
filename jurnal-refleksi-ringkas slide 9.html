<title>Jurnal Refleksi Satu Layar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Ukuran: kotak tetap 451 x 259 px (= 4,7 x 2,7 inci, sama dengan kotak Jurnal Refleksi Digital di slide 9); jika iframe lebih kecil, tampilan mengecil otomatis dan berada di tengah.
   Layout: satu pertanyaan per layar di kapling iframe 451 x 259 px. Halaman buku catatan setinggi iframe; kotak tulis mengisi sisa tinggi. */
:root {
  --bg: #F0F5F4; --paper: #FFFFFF; --ink: #0A2540; --muted: #476175; --rule: #D6E6E4; --margin: #E9A23B;
  --teal: #2EC4B6; --teal-text: #0F7580; --navy: #0A2540; --hole: #DCE8E6; --tint: #E2F6F3; --err: #B3261E;
  --hand: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1B2B; --paper: #12283C; --ink: #E8F1F0; --muted: #9DB4C2; --rule: #24425C; --margin: #EBAE55;
    --teal-text: #62D8CC; --hole: #0B1B2B; --tint: #123A42; --err: #FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1B2B; --paper: #12283C; --ink: #E8F1F0; --muted: #9DB4C2; --rule: #24425C; --margin: #EBAE55;
  --teal-text: #62D8CC; --hole: #0B1B2B; --tint: #123A42; --err: #FF8A80; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; overflow: hidden; }
html, body { margin: 0; }
body {
  position: absolute; top: 0; left: 0; width: 451px; height: 259px; transform-origin: top left; overflow: hidden;
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 13px; line-height: 1.4;
  padding-block: 4px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.book { position: relative; height: 100%; min-height: 250px; max-width: 620px; margin: 0 auto; }
.holes { position: absolute; left: 7px; top: 10px; bottom: 10px; width: 12px; display: flex; flex-direction: column; justify-content: space-around; z-index: 2; pointer-events: none; }
.holes i { width: 12px; height: 12px; border-radius: 50%; background: var(--hole); box-shadow: inset 0 1px 2px rgba(0,0,0,.25); }
.page {
  height: 100%; background: var(--paper); border: 1.5px solid var(--rule); border-radius: 6px 12px 12px 6px; position: relative;
  padding: 8px 12px 8px 38px; display: flex; flex-direction: column; gap: 5px;
}
.page::before { content: ""; position: absolute; left: 29px; top: 0; bottom: 0; width: 2px; background: var(--margin); opacity: .55; }
.head { display: flex; align-items: center; gap: 8px; }
.head svg { width: 26px; height: 26px; flex: none; }
.head h1 { margin: 0; font-family: var(--hand); font-weight: 700; font-size: 19px; line-height: 1; flex: 1; white-space: nowrap; }
.dots { display: flex; gap: 6px; }
.dots button { appearance: none; border: 2px solid var(--teal); background: transparent; width: 16px; height: 16px; border-radius: 50%; padding: 0; cursor: pointer; }
.dots button.filled { background: var(--teal); }
.dots button[aria-current="step"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--navy); }
.mini { appearance: none; font: 700 11px/1 var(--font); color: var(--teal-text); background: var(--tint); border: 0; border-radius: 99px; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
form { flex: 1; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
.q { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px; }
.num { font-family: var(--hand); font-weight: 700; font-size: 19px; line-height: 1.1; color: var(--teal-text); }
.q label { font-size: 12.5px; font-weight: 700; line-height: 1.35; }
textarea {
  flex: 1; min-height: 52px; width: 100%; resize: none; border: 0; background: transparent; color: var(--ink); border-radius: 2px;
  font: 400 15px/26px var(--hand); padding: 0 4px;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 25px, var(--rule) 25px, var(--rule) 26px);
  background-attachment: local;
}
textarea::placeholder, .nm::placeholder { color: var(--muted); opacity: .55; }
textarea:focus-visible, .nm:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
.nav { display: flex; gap: 8px; align-items: center; }
.nav .sp { flex: 1; }
.nm { flex: 1; min-width: 0; height: 32px; border: 0; border-bottom: 1.5px solid var(--rule); background: transparent; font: 400 14px/1 var(--hand); color: var(--ink); padding: 0 4px; }
.btn { appearance: none; font: 800 11px/1 var(--font); letter-spacing: .09em; text-transform: uppercase; cursor: pointer; border-radius: 99px; min-height: 34px; padding: 0 16px; border: 2px solid var(--ink); background: transparent; color: var(--ink); white-space: nowrap; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #0A2540; }
.btn:focus-visible, .mini:focus-visible, .dots button:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
.btn[disabled] { opacity: .6; cursor: progress; }
.msg { margin: 0; font-size: 10.5px; line-height: 1.3; color: var(--muted); min-height: 27px; }
.msg.err { color: var(--err); font-weight: 600; }
.msg.ok { color: var(--teal-text); font-weight: 600; }
.done { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }
.done h2 { margin: 0; font-family: var(--hand); font-size: 20px; line-height: 1.2; }
.done p { margin: 0; font-size: 12.5px; }
.done .row { display: flex; gap: 8px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="book">
  <div class="holes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="page">

    <div class="head">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path d="M6 7h25a4 4 0 0 1 4 4v13a4 4 0 0 1-4 4H19l-7 6v-6H6a4 4 0 0 1-4-4V11a4 4 0 0 1 4-4z" fill="#2EC4B6"/>
        <circle cx="11" cy="17.5" r="2" fill="#0A2540"/><circle cx="18.5" cy="17.5" r="2" fill="#0A2540"/><circle cx="26" cy="17.5" r="2" fill="#0A2540"/>
      </svg>
      <h1>Jurnal Refleksi</h1>
      <div class="dots" role="group" aria-label="Pilih pertanyaan">
        <button type="button" data-go="0" aria-label="Pertanyaan 1"></button>
        <button type="button" data-go="1" aria-label="Pertanyaan 2"></button>
        <button type="button" data-go="2" aria-label="Pertanyaan 3"></button>
      </div>
      <button class="mini" id="salin" type="button">Salin</button>
    </div>

    <form id="jurnal" autocomplete="off" novalidate>
      <div class="q"><span class="num" id="num" aria-hidden="true">1</span><label id="lab" for="isi"></label></div>
      <textarea id="isi" placeholder="Tulis ceritamu di sini..."></textarea>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <div class="nav">
        <button class="btn" id="prev" type="button">Sebelumnya</button>
        <input class="nm" id="nama" type="text" maxlength="60" placeholder="Nama (opsional)" aria-label="Nama panggilan, boleh dikosongkan" hidden>
        <span class="sp" id="sp"></span>
        <button class="btn primary" id="next" type="button">Berikutnya</button>
        <button class="btn primary" id="kirim" type="submit" hidden>Kirim</button>
      </div>
    </form>

    <div class="done" id="done" hidden>
      <h2>Jurnal Anda sudah terkirim.</h2>
      <p>Terima kasih sudah merefleksikan pengalaman Anda. Simpan salinan untuk catatan pribadi sebelum menutup halaman ini.</p>
      <div class="row">
        <button class="btn primary" id="salin2" type="button">Salin jawaban</button>
        <button class="btn" id="lagi" type="button">Tulis lagi</button>
      </div>
      <p class="msg" id="msg2" role="status" aria-live="polite"></p>
    </div>

  </div>
</div>

<script>
/* ===== PENGATURAN PENYELENGGARA =====
   1. Buat Google Form dengan 4 pertanyaan: Nama (jawaban singkat, tidak wajib) dan 3 pertanyaan refleksi (paragraf).
   2. Pada Form: titik tiga > "Dapatkan link isi otomatis", isi tiap pertanyaan dengan teks apa saja, klik "Dapatkan link".
      Dari link itu salin kode entry.XXXXXXX untuk tiap pertanyaan.
   3. Isi formAction dengan tautan Form: ganti /viewform menjadi /formResponse.
   4. Pastikan Form tidak mewajibkan login dan tidak membatasi satu respons per orang. */
var CONFIG = {
  formAction: "https://docs.google.com/forms/d/e/1FAIpQLSccrG7_Yo17Hly-GFSk4fyE9fMw7gUyF3NLvHO6R10gd7WVKw/formResponse",
  fields: { nama: "entry.1369645216", q1: "entry.1080157875", q2: "entry.1020118564", q3: "entry.772428021" }
};

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var QS = [
    "Apa yang biasanya Anda lakukan ketika menghadapi situasi pembelajaran yang tidak sesuai dengan harapan?",
    "Bagaimana cara Anda mengelola rasa kecewa atau kesal agar tetap dapat merespons situasi secara lebih tenang dan objektif?",
    "Apa yang dapat Anda lakukan untuk tetap berfokus pada tujuan pembelajaran ketika menghadapi perilaku murid yang menantang?"
  ];
  var NOTICE = "Jawaban Anda dikumpulkan oleh penyelenggara untuk keperluan pengembangan program.";
  var DEMO = "Mode contoh: formulir belum terhubung ke Google Form, jawaban belum dikirim ke penyelenggara.";
  var demo = !CONFIG.formAction;
  var KEY = "jurnal-refleksi-pnf-draft-v2";
  var ans = ["", "", ""], nama = "", step = 0;
  var dots = Array.prototype.slice.call(document.querySelectorAll(".dots button"));

  function save() { try { localStorage.setItem(KEY, JSON.stringify({ a: ans, n: nama })); } catch (e) {} }
  function load() { try { var o = JSON.parse(localStorage.getItem(KEY) || "null"); if (o) { ans = o.a || ans; nama = o.n || ""; } } catch (e) {} }
  function clearDraft() { try { localStorage.removeItem(KEY); } catch (e) {} }
  function setMsg(t, cls) { var m = $("msg"); m.className = "msg" + (cls ? " " + cls : ""); m.textContent = t; }
  function resetMsg() { setMsg(demo ? DEMO : NOTICE, ""); }
  function keep() { ans[step] = $("isi").value; if (!$("nama").hidden) nama = $("nama").value; save(); paintDots(); }
  function paintDots() {
    dots.forEach(function (d, i) {
      d.classList.toggle("filled", !!ans[i].trim());
      if (i === step) d.setAttribute("aria-current", "step"); else d.removeAttribute("aria-current");
    });
  }
  function show(i) {
    step = i; var last = i === 2;
    $("num").textContent = i + 1; $("lab").textContent = QS[i]; $("isi").value = ans[i];
    $("prev").hidden = i === 0; $("next").hidden = last; $("kirim").hidden = !last;
    $("nama").hidden = !last; $("sp").hidden = last; $("nama").value = nama;
    paintDots(); resetMsg();
  }
  function summary() {
    return "JURNAL REFLEKSI" + (nama.trim() ? " - " + nama.trim() : "") + "\n\n" + QS.map(function (q, i) {
      return (i + 1) + ". " + q + "\n" + (ans[i].trim() || "-");
    }).join("\n\n") + "\n";
  }
  function copy(setter) {
    keep(); var text = summary();
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
      document.body.appendChild(ta); ta.select(); var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      setter(ok ? "Jawaban disalin. Tempel di catatan Anda." : "Gagal menyalin. Blok teks jawaban lalu salin manual.", ok ? "ok" : "err");
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { setter("Jawaban disalin. Tempel di catatan Anda.", "ok"); }, fallback);
    } else { fallback(); }
  }

  $("isi").addEventListener("input", keep);
  $("nama").addEventListener("input", keep);
  $("next").addEventListener("click", function () { keep(); show(step + 1); $("isi").focus(); });
  $("prev").addEventListener("click", function () { keep(); show(step - 1); $("isi").focus(); });
  dots.forEach(function (d) { d.addEventListener("click", function () { keep(); show(+d.getAttribute("data-go")); $("isi").focus(); }); });
  $("salin").addEventListener("click", function () { copy(setMsg); });
  $("salin2").addEventListener("click", function () { copy(function (t, c) { var m = $("msg2"); m.className = "msg " + c; m.textContent = t; }); });
  $("lagi").addEventListener("click", function () {
    ans = ["", "", ""]; nama = ""; $("done").hidden = true; $("jurnal").hidden = false; $("msg2").textContent = ""; show(0);
  });

  $("jurnal").addEventListener("submit", function (e) {
    e.preventDefault(); keep();
    if (!ans.some(function (a) { return a.trim(); })) { setMsg("Tulis jawaban pada setidaknya satu pertanyaan sebelum mengirim.", "err"); return; }
    var btn = $("kirim"); btn.disabled = true; setMsg("Mengirim...", "");
    function finished() { btn.disabled = false; clearDraft(); $("jurnal").hidden = true; $("done").hidden = false; }
    if (demo) { setTimeout(finished, 400); return; }
    var body = new URLSearchParams();
    if (CONFIG.fields.nama) body.append(CONFIG.fields.nama, nama.trim());
    ["q1", "q2", "q3"].forEach(function (k, i) { if (CONFIG.fields[k]) body.append(CONFIG.fields[k], ans[i].trim()); });
    fetch(CONFIG.formAction, { method: "POST", mode: "no-cors", body: body }).then(finished, function () {
      btn.disabled = false; setMsg("Belum terkirim. Periksa koneksi internet lalu coba lagi. Jawaban masih tersimpan di halaman ini.", "err");
    });
  });

  load(); show(0);
})();
</script>
<script>
/* Skala otomatis: kotak 451 x 259 px, tidak pernah lebih besar dari ukuran itu, mengecil bila iframe lebih kecil. */
(function () {
  var W = 451, H = 259;
  function fit() {
    var vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    var k = Math.min(vw / W, vh / H, 1);
    document.body.style.transform = "scale(" + k + ")";
    document.body.style.left = Math.max(0, (vw - W * k) / 2) + "px";
    document.body.style.top = Math.max(0, (vh - H * k) / 2) + "px";
  }
  fit(); window.addEventListener("resize", fit);
})();
</script>
